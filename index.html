<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fechamento de OS - Engenharia Clínica</title>
<style>
:root{--bg:#080d1a;--sf:#0f172a;--sf2:#0b1222;--ln:#1e293b;--ink:#f1f5f9;--mu:#94a3b8;--ac:#22d3ee;--ok:#34d399;--nc:#fb7185;--hl:#5b4b12;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.hd{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}.hd p{margin:0;color:var(--mu);font-size:12px}
#sq{width:min(380px,100%);background:var(--bg);border:1px solid #334155;border-radius:10px;padding:9px 12px}
main{max-width:1180px;margin:0 auto;padding:20px 20px 60px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;border-bottom:1px solid var(--ln);margin-bottom:24px}
nav button{flex:none;background:none;border:1px solid transparent;border-radius:10px;color:var(--mu);padding:8px 14px;font-weight:500}
nav button:hover{color:var(--ink);background:var(--sf)}
nav button[aria-selected=true]{color:var(--ac);background:#0c2a35;border-color:#155e75}
.sec{margin-bottom:34px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sh h2{font-size:16px;margin:0}.sh p{margin:2px 0 0;color:var(--mu);font-size:12px}
.chip0{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--mu);border:1px solid var(--ln);border-radius:6px;padding:2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{--cc:hsl(var(--h) 70% 62%);display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:12px;border:1px solid color-mix(in srgb,var(--cc) 28%,var(--ln));border-top:4px solid var(--cc);background:color-mix(in srgb,var(--cc) 6%,var(--sf))}
.kd{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:12px;font-weight:600;color:var(--cc)}
.kd:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc)}
.card h3{margin:0;font-size:15px}.card p{margin:0 0 6px;color:var(--mu);font-size:12.5px;flex:1}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.b{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--ln);border-radius:999px;padding:6px 14px;font-size:13px}
.b:hover{border-color:var(--cc,var(--ac));background:color-mix(in srgb,var(--cc,var(--ac)) 16%,var(--bg))}
.b i{width:8px;height:8px;border-radius:50%;background:var(--mu)}.b.ok i{background:var(--ok)}.b.nc i{background:var(--nc)}
.tw{border:1px solid var(--ln);border-radius:12px;background:var(--sf);overflow:auto;max-height:460px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--sf2);text-align:left;color:var(--mu);font-weight:500;padding:10px 14px}
td{padding:9px 14px;border-top:1px solid var(--ln)}td:first-child{font:600 12.5px ui-monospace,Menlo,Consolas,monospace;color:var(--ac);white-space:nowrap}
td:last-child{white-space:nowrap;text-align:right}
.sm{background:var(--bg);border:1px solid #334155;border-radius:8px;padding:3px 10px;font-size:12px}.sm:hover{border-color:var(--ac)}
#pf{width:min(260px,100%);background:var(--sf);border:1px solid #334155;border-radius:10px;padding:7px 12px;font-size:13px}
.empty{padding:30px;text-align:center;color:var(--mu)}
dialog{--cc:hsl(var(--h,190) 70% 62%);background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:14px;padding:0;width:min(600px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(4,8,16,.75);backdrop-filter:blur(4px)}
.mh{display:flex;justify-content:space-between;gap:12px;padding:16px 20px;border-top:4px solid var(--cc);border-radius:14px 14px 0 0;background:var(--sf2);border-bottom:1px solid var(--ln)}
.mh h2{margin:0;font-size:16px}.mh p{margin:2px 0 0;font-size:12.5px;font-weight:600;color:var(--cc)}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--mu);align-self:flex-start}
.mb{padding:16px 20px}.fld{margin-bottom:12px}.fld label,.lb{display:block;font-size:12.5px;color:var(--mu);margin-bottom:4px}
.fld input,textarea{width:100%;background:var(--bg);border:1px solid #334155;border-radius:8px;padding:8px 10px}
textarea{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ch{border:0;border-radius:6px;background:color-mix(in srgb,var(--cc) 18%,var(--bg));color:var(--cc);font-size:12.5px;padding:3px 10px}
.ch.sv{background:none;border:1px dashed #334155;color:var(--mu)}.ch s{text-decoration:none;opacity:.6;margin-left:6px}
.mfo{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 16px;background:var(--sf2);border-top:1px solid var(--ln);border-radius:0 0 14px 14px}
.p,.s{border-radius:10px;padding:9px 18px}.p{background:var(--cc);border:0;color:#06101a;font-weight:700}.s{background:none;border:1px solid #334155;color:var(--mu)}
.ha{display:flex;gap:8px;flex:1;justify-content:flex-end;min-width:260px}.ha .s{padding:8px 14px;white-space:nowrap}
.grid.eq{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.grid.eq .card h3{font-size:14px;margin-bottom:6px}
#hl{max-height:60vh;overflow:auto}.hi{border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--bg)}
.hm{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mu)}.hm b{color:var(--ink);font-weight:600}
.hi p{margin:6px 0 8px;font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#toast{position:fixed;right:20px;bottom:20px;background:var(--sf);border:1px solid #334155;border-radius:10px;padding:10px 16px;font-size:13px;opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s;z-index:99;max-width:calc(100% - 40px)}
#toast.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header><div class="hd">
  <div><h1>Fechamento de OS</h1><p>Engenharia Clínica: modelos prontos para copiar</p></div>
  <div class="ha"><input id="sq" type="search" placeholder="Pesquisar modelos, POPs, equipamentos…" aria-label="Pesquisar"><button class="s" id="hb">Histórico</button></div>
</div></header>
<main><nav id="tabs" role="tablist"></nav><div id="app"></div></main>
<dialog id="dlg">
  <div class="mh"><div><h2 id="mt"></h2><p id="ms"></p></div><button class="x" id="x" aria-label="Fechar">×</button></div>
  <div class="mb"><div id="mf"></div><label class="lb" for="out">Texto da OS (pode editar antes de copiar)</label><textarea id="out" rows="6"></textarea></div>
  <div class="mfo"><button class="s" id="cn">Cancelar</button><button class="p" id="cp">Copiar texto</button></div>
</dialog>
<dialog id="hd">
  <div class="mh"><div><h2>Histórico</h2><p>Últimos textos copiados neste navegador</p></div><button class="x" id="hx" aria-label="Fechar">×</button></div>
  <div class="mb" id="hl"></div>
  <div class="mfo"><button class="s" id="hc">Limpar histórico</button><button class="p" id="hk">Fechar</button></div>
</dialog>
<datalist id="pl"></datalist>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const YY=String(new Date().getFullYear()).slice(2);
const L={e:'Empresa',p:'POP',c:'Nº do certificado',a:'Avaria',m:'Motivo'};
const PH={e:'Nome da empresa',p:'Selecione ou digite',c:'Só o número, ex.: 0123',a:'Descreva a avaria',m:'Ex.: avaria, em uso pelo paciente'};
const DEF=['Surgical','Vilela','Geeta','Precisa','Drager','Mhedica'];
let cos=[];try{cos=JSON.parse(localStorage.getItem('cos')||'[]')}catch(e){}
const saveCos=()=>{try{localStorage.setItem('cos',JSON.stringify(cos))}catch(e){}};

/* Tipos de card: mesma cor em todas as abas */
const K={ec:['Engenharia Clínica',175],terc:['Terceiros',225],prev:['Preventiva',280],mapa:['MAPA',315],nr:['Não realizado',28],nl:['Não localizado',50],nd:['Não disponibilizado',95]};

/* Textos. Marcadores: {e} empresa, {p} POP, {c} certificado, {a} avaria, {m} motivo */
const ac=(pr,ok,emp)=>`Durante os ensaios de calibração ${emp?'realizados pela empresa {e}, seguindo':'conduzidos de acordo com'} as diretrizes estabelecidas pelo ${pr} e a tabela de critérios de aceitação, foi constatado que o equipamento ${ok?'apresentou valores dentro do limite aceitável. É seguro concluir, portanto, que ele está apto para uso.':'não apresentou valores dentro do limite aceitável. Portanto, este se encontra inapto para uso.'}`;
const ds=(pr,ok,emp)=>{const w=emp?'empresa {e}':'Eng Clínica';return ok?`A Calibração foi REALIZADA CONFORME pela ${w}, de acordo com o ${pr} e tabela de critérios de aceitação. Testes funcionais ok. Equipamento apto para uso. Segundo certificado em anexo${emp?'':` CAL/ENG{c}-${YY}`}.`:`A calibração foi REALIZADA NÃO CONFORME, pois durante a manutenção programada executada pela ${w}, seguindo o ${pr} o equipamento apresentou valores fora dos limites estabelecidos pela tabela de critérios de aceitação. Dessa forma, estando inapto para uso.`};
const par=(f,emp,pr)=>{const e=emp?['e']:[];return[['Conforme','ok',f(pr,1,emp),emp?e:f==ds?['c']:[]],['Não conforme','nc',f(pr,0,emp),e]]};
const one=(t,f=[])=>[['Abrir modelo','na',t,f]];
const PR='PRS ENG 04',P34='POP ENG 034';
const tac=(ok,emp)=>`Durante o Teste de Segurança Elétrica realizado ${emp?'pela empresa {e}, conforme':'conforme'} as normas ABNT (IEC 60601-1 / IEC 62353) e POP ENG 068 o equipamento apresentou valores ${ok?'aceitáveis e encontra-se apto para uso.':'fora dos limites aceitáveis e encontra-se inapto para uso.'}`;
const tsd=(ok,emp)=>`O Teste de Segurança elétrica foi REALIZADO ${ok?'CONFORME':'NÃO CONFORME'} pela ${emp?'empresa {e}':'Eng Clínica'}, ${ok?'seguindo as diretrizes do POP ENG 068. Testes funcionais ok. Equipamento apto para uso.':'pois mesmo seguindo as diretrizes do POP ENG 068, o equipamento apresentou valores fora do limite aceitável, estando portanto inapto para uso.'} De acordo com certificado${emp?'':` TSE/ENG{c}-${YY}`} em anexo.`;
const tp=(f,emp)=>{const x=emp?['e']:f==tsd?['c']:[];return[['Conforme','ok',f(1,emp),x],['Não conforme','nc',f(0,emp),x]]};
const PREV=['A manutenção preventiva foi REALIZADA CONFORME pela Eng clínica, seguindo as diretrizes do {p}, no qual foram executados testes funcionais e este apresentou desempenho esperado pelos padrões estabelecidos, atestando sua aptidão para uso.','A manutenção preventiva foi REALIZADA NÃO CONFORME, pois durante a execução pela Eng clínica, seguindo as diretrizes do {p}, o equipamento apresentou a seguinte avaria: {a}, no qual foi atestado sua inaptidão para uso.'];
const MAPA='Manutenção preventiva em MAPA realizada com sucesso conforme o POP ENG 047, equipamento liberado para uso.';

const S=[
{id:'calib',n:'Calibração',d:'Ensaios conduzidos segundo as diretrizes do PRS ENG 04',ch:'PRS ENG 04',c:[
 {k:'ec',t:'Análise crítica',d:'Conduzida pela equipe interna, conforme tabela de critérios de aceitação.',b:par(ac,0,PR)},
 {k:'terc',t:'Análise crítica',d:'Realizada por empresa contratada. Informe a empresa.',b:par(ac,1,PR)},
 {k:'ec',t:'Descrição de serviço',d:'Calibração interna com certificado CAL/ENG em anexo.',b:par(ds,0,PR)},
 {k:'terc',t:'Descrição de serviço',d:'Calibração executada por terceiros, certificado em anexo.',b:par(ds,1,PR)}]},
{id:'tse',n:'TSE',d:'Normas ABNT (IEC 60601-1 / IEC 62353) e POP ENG 068',ch:'POP ENG 068',c:[
 {k:'ec',t:'Análise crítica',d:'Teste de segurança elétrica: valores dentro ou fora dos limites.',b:tp(tac,0)},
 {k:'terc',t:'Análise crítica',d:'Teste realizado por empresa contratada. Informe a empresa.',b:tp(tac,1)},
 {k:'ec',t:'Descrição de serviço',d:'Laudo descritivo com número do certificado TSE/ENG.',b:tp(tsd,0)},
 {k:'terc',t:'Descrição de serviço',d:'Teste executado por terceiros, certificado em anexo.',b:tp(tsd,1)}]},
{id:'prev',n:'Preventiva',d:'Manutenções periódicas programadas por POP específico',ch:'POP geral',c:[
 {k:'prev',t:'Manutenção preventiva padrão',d:'Escolha o POP. Na não conformidade, descreva a avaria.',b:[['Conforme','ok',PREV[0],['p']],['Não conforme','nc',PREV[1],['p','a']]]},
 {k:'mapa',t:'MAPA',d:'Modelo específico do POP ENG 047.',b:one(MAPA)}]},
{id:'pressao',n:'Aparelho de pressão',d:'Calibração segundo o POP ENG 034',ch:'POP ENG 034',c:[
 {k:'ec',t:'Análise crítica',d:'Valores dentro ou fora do limite aceitável.',b:par(ac,0,P34)},
 {k:'ec',t:'Descrição de serviço',d:'Calibração interna com certificado CAL/ENG em anexo.',b:par(ds,0,P34)}]},
{id:'oc',n:'Ocorrências',d:'Justificativas para manutenção programada não realizada no mês',ch:'Impedimentos',c:[
 {k:'nr',t:'Não realizado',d:'Impedimento técnico ou operacional. Informe o motivo.',b:one('NÃO REALIZADO, pois o equipamento apresentou {m}, mediante ao fato descrito a manutenção programada não pôde ser executada.',['m'])},
 {k:'nl',t:'Não localizado',d:'Equipamento não localizado no setor no mês vigente.',b:one('NÃO LOCALIZADO, pelo setor de origem, para realização da sua manutenção programada dentro do mês vigente.')},
 {k:'nd',t:'Não disponibilizado',d:'Setor não liberou o aparelho para a manutenção.',b:one('NÃO DISPONIBILIZADO, pelo setor de origem, para realização da sua manutenção programada dentro do mês vigente.')}]}
];

const POPS=`001 Tratamento de solicitações de serviço
002 Atualizações e Revisões de Cronogramas de Manutenções Programadas
003 Aquisição, Avaliação, Especificação, Recebimento, Instalação e Treinamento
004 Manutenção Preventiva em Monitores Multiparâmetros
005 Manutenção Preventiva em Cardioversores
006 Manutenção Preventiva em Carrinhos de Anestesia
007 Manutenção Preventiva em Oxímetros
008 Manutenção Preventiva em Bisturis
009 Manutenção Preventiva em Focos Cirúrgicos
010 Manutenção Preventiva em Mesas Cirúrgicas
011 Manutenção Preventiva em Câmeras de Vídeo
012 Manutenção Preventiva em Raio-X
013 Manutenção Preventiva em Microscópios Cirúrgicos
014 Manutenção Preventiva em Fontes de Luz
015 Manutenção Preventiva em Insufladores
016 Manutenção Preventiva em Circulação Extra Corpórea
017 Manutenção Preventiva em Ventiladores/Respiradores
018 Manutenção Preventiva em Arcos Cirúrgicos
019 Manutenção Preventiva em Aparelho de Ultrassom
020 Manutenção Preventiva em Eletrocardiógrafos
021 Manutenção Preventiva em Aspiradores de Secreção
022 Manutenção Preventiva em Processador de Filmes
023 Manutenção Preventiva em Esteiras Ergométricas
024 Manutenção Preventiva em Holter
025 Manutenção Preventiva em Lavadora Ultrassônica
026 Coleta de Água para análise - CME
027 Manutenção Preventiva em Balão Intra-aórtico
028 Realização da Manutenção Preventiva em Máquinas de Hemodiálise
029 Manutenção Preventiva nas Reprocessadoras de Capilares
030 Manutenção Preventiva do sistema de controle e produção de concentrado
031 Desinfecção do tanque de água tratada e do loop de distribuição com ozônio
032 Realização da Desinfecção do Tanque de Água Tratada e Sistema do Loop de Distribuição
033 Manutenção Preventiva do Sistema de Tratamento do serviço de diálise
034 Calibração de aparelho de pressão
035 Coleta de água para análise - Diálise
036 Manual de conduta para o tratamento de água
037 Sistema Operacional do Tratamento de Água da Hemodiálise
038 Teste Diário do Sistema de Tratamento de Água da Diálise
039 Manutenção Preventiva em Osmose Reversa 1º passo
040 Manutenção Preventiva em Osmose Reversa 2º passo
041 Rotinas para Tecnovigilância
042 Manutenção Preventiva em Armário de Vídeo
043 Manutenção Preventiva em Aquecedor
044 Manutenção Preventiva em Balança
045 Manutenção Preventiva em Bilispot
046 Manutenção Preventiva em Incubadora
047 Manutenção Preventiva em MAPA
048 Manutenção Preventiva em Torniquete
049 Manutenção Preventiva em Craniótomo
050 Manutenção Preventiva em Urodinâmica
051 Manutenção Preventiva em Hemocron
053 Processo Administrativo - Montagem de orçamentos
054 Manutenção Preventiva em Colposcópio/Videocolposcópio
055 Manutenção Preventiva em Polígrafo
056 Manutenção Preventiva em Micrótomo
057 Manutenção Preventiva em Serra de Gesso
058 Manutenção Preventiva em Radiômetro
059 Avaliação e verificação de certificado de calibração e TSE
060 Manutenção Preventiva em Otocalorímetro
061 Recebimento e conferência de notas fiscais
062 Processo Administrativo - Alimentação de planilhas
063 Processo Administrativo - Arquivamento de documentos
064 Descontinuidade e descarte em equipamento eletromédico e instrumentos de medição
065 Validação dos serviços de calibração
066 Realização da Desinfecção do Tanque de Água Tratada e Sistema do Loop de Distribuição do CME
067 Teste Diário do Sistema de Tratamento de Água da CME
068 Teste de Segurança Elétrica
069 Manutenção Preventiva em Bomba de Sangue
070 Manutenção em CAMA
071 Manutenção Preventiva em Estufa para Cultura
072 Manutenção Preventiva em Audiômetro Siemens
073 Manutenção Preventiva em Detector Fetal
074 Manutenção Preventiva em Impedanciômetro
075 Manutenção Preventiva em Monitor de Óxido Nítrico
076 Manutenção Preventiva em Rotem Delta
077 Manutenção Preventiva em Spot Signs XLi
078 Manutenção Preventiva em Video Printer
079 Manutenção Preventiva em Elevador
080 Manutenção Preventiva em Eletroencefalógrafo
081 Manutenção Preventiva em Walbox
082 Manutenção Preventiva em Osmose Reversa Portátil
083 Abertura de chamados técnicos para empresas terceirizadas
084 Manutenção Corretiva
085 Verificação - Atualização da Planilha de Padrão de Fornecedores
086 Teste de Linearidade dos Glicosímetros Freestyle Precision Pro Abbott
087 Geração e Impressão de OS Programadas
088 Manutenção Preventiva em Autoclave Vertical AV75`.split('\n').map(s=>({c:'POP ENG '+s.slice(0,3),n:s.slice(4),prev:/Manutenção Preventiva|Manutenção em CAMA/.test(s)}));
const eqn=n=>n.replace(/^(Realização da )?Manutenção (Preventiva )?(em |nas |do |de )?/,'');
$('#pl').innerHTML=POPS.filter(p=>p.prev).map(p=>`<option value="${p.c}">${eqn(p.n)}</option>`).join('');

/* Estado e montagem da tela */
let tab='all',cur=null;const V={};
let hist=[];try{hist=JSON.parse(localStorage.getItem('hist')||'[]')}catch(e){}
const saveH=()=>{try{localStorage.setItem('hist',JSON.stringify(hist))}catch(e){}};
const addH=(t,k)=>{hist=[{t,k,d:Date.now()},...hist.filter(x=>x.t!==t)].slice(0,20);saveH()};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function build(){
 $('#tabs').innerHTML=[['all','Todos'],...S.map(s=>[s.id,s.n]),['equip','Por equipamento'],['pops','Catálogo de POPs']].map(([i,n])=>`<button role="tab" data-i="${i}" aria-selected="${i==tab}">${n}</button>`).join('');
 const app=$('#app');app.innerHTML='';
 S.forEach(s=>{
  const e=document.createElement('section');e.className='sec';e.dataset.id=s.id;
  e.innerHTML=`<div class="sh"><div><h2>${s.n}</h2><p>${s.d}</p></div><span class="chip0">${s.ch}</span></div><div class="grid"></div>`;
  s.c.forEach(c=>{
   const d=document.createElement('div');d.className='card';d.style.setProperty('--h',K[c.k][1]);
   d.dataset.s=norm([s.n,K[c.k][0],c.t,c.d,...c.b.map(b=>b[2])].join(' '));
   d.innerHTML=`<span class="kd">${K[c.k][0]}</span><h3>${c.t}</h3><p>${c.d}</p><div class="btns"></div>`;
   c.b.forEach(b=>{const x=document.createElement('button');x.className='b '+b[1];x.innerHTML=`<i></i>${b[0]}`;x.onclick=()=>openM(c,b);d.lastChild.append(x)});
   e.lastChild.append(d);
  });
  app.append(e);
 });

 const eq=document.createElement('section');eq.className='sec';eq.dataset.id='equip';
 eq.innerHTML='<div class="sh"><div><h2>Preventiva por equipamento</h2><p>Escolha o equipamento: o POP já vem preenchido.</p></div><span class="chip0">Preventiva</span></div><div class="grid eq"></div>';
 POPS.filter(p=>p.prev).forEach(p=>{
  const nm=eqn(p.n),mp=p.c.endsWith('047'),d=document.createElement('div');
  d.className='card';d.style.setProperty('--h',K[mp?'mapa':'prev'][1]);d.dataset.s=norm('preventiva '+nm+' '+p.c);
  d.innerHTML=`<span class="kd">${p.c}</span><h3>${nm}</h3><div class="btns"></div>`;
  [mp?['Conforme','ok',MAPA,[]]:S[2].c[0].b[0],S[2].c[0].b[1]].forEach(b=>{
   const x=document.createElement('button');x.className='b '+b[1];x.innerHTML=`<i></i>${b[0]}`;
   x.onclick=()=>{V.p=p.c;openM({k:mp&&b[1]=='ok'?'mapa':'prev',t:nm},b)};d.lastChild.append(x)});
  eq.lastChild.append(d);
 });
 app.append(eq);
 app.insertAdjacentHTML('beforeend',`<section class="sec" data-id="pops"><div class="sh"><div><h2>Catálogo de POPs</h2><p>POP ENG 001 ao 088. Em POPs de preventiva, “Texto OS” abre o modelo já preenchido.</p></div><input id="pf" type="search" placeholder="Filtrar: 023, hemodiálise…" aria-label="Filtrar POPs"></div><div class="tw"><table><thead><tr><th>Código</th><th>Procedimento</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></section>`);
 $('#pf').oninput=apply;apply();
}
function apply(){
 const q=norm($('#sq').value.trim()),pq=norm(($('#pf')||{value:''}).value.trim())||q;
 let n=0;
 document.querySelectorAll('.card').forEach(c=>c.hidden=!c.dataset.s.includes(q));
 document.querySelectorAll('.sec').forEach(s=>{
  const id=s.dataset.id,show=(tab=='all'&&id!='equip')||tab==id||(q&&id!='pops');
  s.hidden=id=='pops'?!(tab=='all'||tab==id||q):!show||![...s.querySelectorAll('.card')].some(c=>!c.hidden);
 });
 const list=POPS.filter(p=>norm(p.c+' '+p.n).includes(pq));
 $('#tb').innerHTML=list.length?'':'<tr><td colspan="3" class="empty">Nenhum POP encontrado.</td></tr>';
 list.forEach(p=>{
  const tr=document.createElement('tr');
  tr.innerHTML=`<td>${p.c}</td><td>${p.n}</td><td></td>`;
  const a=tr.lastChild,cb=document.createElement('button');cb.className='sm';cb.textContent='Código';cb.onclick=()=>copy(p.c,'Código copiado');a.append(cb);
  if(p.prev){const tb=document.createElement('button');tb.className='sm';tb.textContent='Texto OS';tb.style.marginLeft='6px';
   tb.onclick=()=>{if(p.c.endsWith('047'))openM({k:'mapa',t:'MAPA'},S[2].c[1].b[0]);else{V.p=p.c;openM({k:'prev',t:'Manutenção preventiva padrão'},S[2].c[0].b[0])}};a.append(tb)}
  $('#tb').append(tr);
 });
}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.i;$('#tabs').querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x==b));apply()}};
$('#sq').oninput=apply;

/* Modal */
function chips(inp){
 const w=document.createElement('div');w.className='chips';
 const set=n=>{inp.value=n;V.e=n;gen()};
 const draw=()=>{w.innerHTML='';
  [...DEF,...cos].forEach(n=>{const b=document.createElement('button');b.className='ch';b.textContent=n;b.onclick=()=>set(n);
   if(cos.includes(n)){const r=document.createElement('s');r.textContent='×';r.title='Remover atalho';r.onclick=ev=>{ev.stopPropagation();cos=cos.filter(c=>c!==n);saveCos();draw()};b.append(r)}w.append(b)});
  const sv=document.createElement('button');sv.className='ch sv';sv.textContent='Salvar atalho';
  sv.onclick=()=>{const n=inp.value.trim();if(n&&![...DEF,...cos].includes(n)){cos.push(n);saveCos();draw()}};w.append(sv)};
 draw();return w;
}
let miss=[];
function gen(){
 miss=[];
 $('#out').value=cur.tx.replace(/\{(\w)\}/g,(_,k)=>{const v=(V[k]||'').trim();if(v)return v;miss.push(L[k]);return `(${L[k]})`});
}
function openM(c,b){
 cur={tx:b[2],k:c.t+(b[1]=='na'?'':', '+b[0].toLowerCase())+' ('+K[c.k][0]+')'};
 const dl=$('#dlg');dl.style.setProperty('--h',K[c.k][1]);
 $('#mt').textContent=c.t+(b[1]=='na'?'':', '+b[0].toLowerCase());$('#ms').textContent=K[c.k][0];
 const f=$('#mf');f.innerHTML='';
 b[3].forEach(k=>{
  const w=document.createElement('div');w.className='fld';
  w.innerHTML=`<label for="f${k}">${L[k]}</label><input id="f${k}" autocomplete="off" placeholder="${PH[k]}"${k=='p'?' list="pl"':''}${k=='c'?' inputmode="numeric"':''}>`;
  const i=w.querySelector('input');i.value=V[k]||'';i.oninput=()=>{V[k]=i.value;gen()};
  f.append(w);if(k=='e')w.append(chips(i));
 });
 gen();dl.showModal();
 const fi=f.querySelector('input');if(fi)fi.focus();
}
const close=()=>$('#dlg').close();
$('#x').onclick=$('#cn').onclick=close;
$('#dlg').addEventListener('click',e=>{if(e.target.id=='dlg')close()});
$('#cp').onclick=async()=>{
 const ok=await copy($('#out').value,miss.length?'Copiado, mas falta preencher: '+miss.join(', '):'Texto copiado');
 if(ok){addH($('#out').value,cur.k);close()}
};
async function copy(t,msg){
 let ok=false;
 try{await navigator.clipboard.writeText(t);ok=true}catch(e){
  const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();
  try{ok=document.execCommand('copy')}catch(_){}a.remove();
 }
 toast(ok?msg:'Não foi possível copiar. Selecione o texto e use Ctrl+C.');return ok;
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)}
function renderH(){
 const l=$('#hl');l.innerHTML=hist.length?'':'<div class="empty">Nada copiado ainda.</div>';
 hist.forEach(x=>{
  const r=document.createElement('div');r.className='hi';
  r.innerHTML='<div class="hm"><b></b><span></span></div><p></p>';
  r.querySelector('b').textContent=x.k;
  r.querySelector('span').textContent=new Date(x.d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  r.querySelector('p').textContent=x.t;
  const b=document.createElement('button');b.className='sm';b.textContent='Copiar de novo';b.onclick=()=>copy(x.t,'Texto copiado');
  r.append(b);l.append(r);
 });
}
$('#hb').onclick=()=>{renderH();$('#hd').showModal()};
$('#hx').onclick=$('#hk').onclick=()=>$('#hd').close();
$('#hc').onclick=()=>{hist=[];saveH();renderH()};
$('#hd').addEventListener('click',e=>{if(e.target.id=='hd')e.target.close()});
build();
</script>
</body>
